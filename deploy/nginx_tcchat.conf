# Configuração de proxy reverso Nginx para o TCChat (opcional — só precisa
# disso se quiser porta 80/443 "normal" e/ou HTTPS na frente do gunicorn,
# que por padrão fica escutando em 127.0.0.1:5000).
#
# Amazon Linux: copie para /etc/nginx/conf.d/tcchat.conf
# Ubuntu:       copie para /etc/nginx/sites-available/tcchat.conf
#               e crie o link: sudo ln -s /etc/nginx/sites-available/tcchat.conf /etc/nginx/sites-enabled/
#
# Depois de copiar:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Para HTTPS (precisa de um domínio apontando para o IP da instância):
#   sudo certbot --nginx -d seu-dominio.com.br
# (instalar o certbot antes: Amazon Linux -> sudo dnf install certbot python3-certbot-nginx
#                             Ubuntu       -> sudo apt install certbot python3-certbot-nginx)

server {
    listen 80;
    server_name _;   # troque pelo seu domínio quando tiver um

    client_max_body_size 25M;  # um pouco acima do limite de 20 MB do upload de documentos

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
