<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar no Lumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="pagina-login">
  <main class="login">
    <div class="logo-tile" aria-hidden="true">
      <svg class="ico"><use href="/static/icons.svg#sun"/></svg>
    </div>

    <h1 id="titulo">Bem-vindo de volta</h1>
    <p class="subtitulo" id="subtitulo">Converse com uma IA que orienta e revisa o seu TCC.</p>

    <section class="cartao-login">
      <button type="button" class="btn-google" id="btn-google">
        <svg class="ico"><use href="/static/icons.svg#google"/></svg>
        Continuar com Google
      </button>

      <div class="divisor"><span>ou</span></div>

      <form id="form-login" novalidate>
        <label class="sr-only" for="login-email">E-mail</label>
        <input id="login-email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
        <label class="sr-only" for="login-senha">Senha</label>
        <input id="login-senha" name="senha" type="password" autocomplete="current-password" placeholder="Senha" required>
        <button class="btn-principal" type="submit">Entrar</button>
      </form>

      <form id="form-cadastro" hidden novalidate>
        <label class="sr-only" for="cad-nome">Nome</label>
        <input id="cad-nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" required>
        <label class="sr-only" for="cad-email">E-mail</label>
        <input id="cad-email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
        <label class="sr-only" for="cad-senha">Senha</label>
        <input id="cad-senha" name="senha" type="password" autocomplete="new-password" minlength="8" placeholder="Senha (mínimo 8 caracteres)" required>
        <button class="btn-principal" type="submit">Criar conta</button>
      </form>

      <p id="erro" class="erro" role="alert"></p>
    </section>

    <p class="troca">
      <span id="troca-texto">Não tem conta?</span>
      <button type="button" class="link" id="btn-troca">Cadastre-se</button>
    </p>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
